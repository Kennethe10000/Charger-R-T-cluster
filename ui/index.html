<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Cluster</title>
<style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
canvas{width:100vw;height:100vh;display:block}
</style></head><body><canvas id="c" width="1920" height="720"></canvas>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');
const data={rpm:0,speed:0,coolant:195,oil:40,volts:14.1,fuel:60,oilLife:80,tires:[32,32,32,32]};

// fake data: replace this block with a WebSocket later
let t=0;
setInterval(()=>{t+=0.03;
 data.rpm=3000+2500*Math.sin(t);
 data.speed=60+50*Math.sin(t*0.7);
 data.coolant=195+5*Math.sin(t*0.2);
 data.oil=40+20*Math.sin(t*0.5);
 data.volts=14.0+0.5*Math.sin(t*0.3);
 data.fuel=60+30*Math.sin(t*0.05);
 data.tires=[32,32.5,31.5+Math.sin(t*0.1),32];},33);

function gauge(x,y,r,val,max,label){
 const a0=Math.PI*0.75,a1=Math.PI*2.25;
 const a=a0+(a1-a0)*Math.min(Math.max(val/max,0),1);
 g.lineWidth=28;g.lineCap='round';
 g.strokeStyle='#222';g.beginPath();g.arc(x,y,r,a0,a1);g.stroke();
 g.strokeStyle='#0cf';g.beginPath();g.arc(x,y,r,a0,a);g.stroke();
 g.fillStyle='#fff';g.textAlign='center';
 g.font='bold 110px monospace';g.fillText(Math.round(val),x,y+30);
 g.font='36px monospace';g.fillStyle='#888';g.fillText(label,x,y+85);
}
function stat(x,y,label,val,unit,bad){
 g.textAlign='center';
 g.fillStyle='#888';g.font='32px monospace';g.fillText(label,x,y);
 g.fillStyle=bad?'#f33':'#fff';g.font='bold 60px monospace';
 g.fillText(val+' '+unit,x,y+60);
}
function tire(x,y,label,val){
 g.textAlign='center';
 g.fillStyle='#888';g.font='28px monospace';g.fillText(label,x,y);
 g.fillStyle=val<28?'#f33':'#0cf';g.font='bold 38px monospace';
 g.fillText(val.toFixed(1),x,y+44);
}
function draw(){
 g.clearRect(0,0,1920,720);
 gauge(400,360,250,data.speed,160,'MPH');
 gauge(1520,360,250,data.rpm,7000,'RPM');
 stat(820,110,'COOLANT',Math.round(data.coolant),'F',data.coolant>230);
 stat(1100,110,'OIL PRESSURE',Math.round(data.oil),'PSI',data.oil<20);
 stat(820,260,'BATTERY',data.volts.toFixed(1),'V',data.volts<12);
 stat(1100,260,'FUEL',Math.round(data.fuel),'%',data.fuel<15);
 stat(960,410,'OIL LIFE',Math.round(data.oilLife),'%',data.oilLife<15);
 g.fillStyle='#888';g.font='28px monospace';g.textAlign='center';
 g.fillText('TIRE PSI',960,530);
 tire(780,575,'FL',data.tires[0]);tire(900,575,'FR',data.tires[1]);
 tire(1020,575,'RL',data.tires[2]);tire(1140,575,'RR',data.tires[3]);
 requestAnimationFrame(draw);
}
draw();
</script></body></html>
